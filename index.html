<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 7 ICT - Ultimate Classroom Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
    
    /* Top Header & Scoreboard */
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; }
    .game-title { font-size: 1.5rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .q-counter { font-size: 1.2rem; background: #334155; padding: 6px 18px; border-radius: 20px; font-weight: 600; color: #f1f5f9; }
    
    /* Scoreboard & Team Card */
    .scoreboard { display: flex; gap: 12px; }
    .team-card { background: #0f172a; padding: 10px 20px; border-radius: 12px; border: 1px solid #475569; text-align: center; min-width: 140px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-header { display: flex; justify-content: center; align-items: center; gap: 6px; }
    .team-name { font-size: 1rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; }
    .rename-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.85rem; }
    .rename-btn:hover { color: #f59e0b; }
    .team-score { font-size: 1.8rem; font-weight: bold; color: #f59e0b; margin: 4px 0; }

    /* Main Question Box */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; margin: 0 auto; width: 100%; }
    .round-badge { align-self: center; background: #8b5cf6; color: #fff; padding: 6px 22px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .question-box { background: #1e293b; padding: 35px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; border: 2px solid #334155; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 2rem; font-weight: 700; line-height: 1.35; color: #f8fafc; }

    /* Options Grid (Kahoot Theme) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .option-card { padding: 22px 20px; border-radius: 16px; display: flex; align-items: center; font-size: 1.4rem; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .option-card:hover { transform: translateY(-3px); }
    
    .shape { font-size: 2rem; margin-right: 18px; opacity: 0.95; }
    .opt-a { background-color: #e21b3c; color: white; }
    .opt-b { background-color: #1368ce; color: white; }
    .opt-c { background-color: #d89e00; color: white; }
    .opt-d { background-color: #26890c; color: white; }

    .dimmed { opacity: 0.2; transform: scale(0.98); }
    .correct-answer { transform: scale(1.03); outline: 4px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.8); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 15px rgba(255,255,255,0.4); }
      to { box-shadow: 0 0 35px rgba(255,255,255,0.95); }
    }

    /* Footer Controls */
    footer { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; background: #1e293b; padding: 15px 25px; border-radius: 16px; border: 1px solid #334155; }
    .control-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-nav { background: #475569; color: white; }
    .btn-nav:hover { background: #64748b; }
    .btn-reveal { background: #f59e0b; color: #0f172a; font-size: 1.25rem; padding: 12px 36px; }
    .btn-reveal:hover { background: #d97706; }
    .btn-finish { background: #ec4899; color: white; }
    .btn-finish:hover { background: #db2777; }

    /* Winner Popup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 3px solid #f59e0b; border-radius: 24px; padding: 40px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .trophy-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    
    .winner-title { font-size: 2.2rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .winner-subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }
    .leaderboard-list { margin-bottom: 30px; text-align: left; background: #0f172a; border-radius: 16px; padding: 15px 20px; border: 1px solid #334155; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: 600; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-1 { color: #f59e0b; }
  </style>
</head>
<body>

  <!-- Top Header with Scoreboard (Team 1 Only) -->
  <header>
    <div class="game-title">🎮 Grade 7 ICT Challenge</div>
    <div class="q-counter" id="q-counter">Question 1 / 50</div>
    <div class="scoreboard">
      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-0">Team 1</span>
          <button class="rename-btn" onclick="renameTeam()" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-0">0</div>
      </div>
    </div>
  </header>

  <!-- Main Question Screen -->
  <main>
    <div class="round-badge" id="round-badge">Unit 1: Central Processing Unit</div>
    <div class="question-box">
      <div class="question-text" id="question-text">Loading Question...</div>
    </div>

    <!-- Interactive Options Grid -->
    <div class="options-grid">
      <div class="option-card opt-a" id="opt-0" onclick="checkAnswer(0)">
        <span class="shape">▲</span><span id="opt-text-0">Option A</span>
      </div>
      <div class="option-card opt-b" id="opt-1" onclick="checkAnswer(1)">
        <span class="shape">◆</span><span id="opt-text-1">Option B</span>
      </div>
      <div class="option-card opt-c" id="opt-2" onclick="checkAnswer(2)">
        <span class="shape">●</span><span id="opt-text-2">Option C</span>
      </div>
      <div class="option-card opt-d" id="opt-3" onclick="checkAnswer(3)">
        <span class="shape">■</span><span id="opt-text-3">Option D</span>
      </div>
    </div>
  </main>

  <!-- Control Buttons -->
  <footer>
    <button class="control-btn btn-nav" onclick="prevQuestion()">◄ Previous</button>
    <button class="control-btn btn-reveal" onclick="revealAnswer()">Show Answer 👁️</button>
    <button class="control-btn btn-finish" onclick="showWinnerModal()">Finish Game 🏆</button>
    <button class="control-btn btn-nav" onclick="nextQuestion()">Next Question ►</button>
  </footer>

  <!-- Winner Pop-up Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="trophy-icon">🏆</div>
      <div class="winner-title" id="winner-headline">CHAMPIONS!</div>
      <div class="winner-subtitle" id="winner-subtext">Great job Grade 7 ICT students!</div>
      <div class="leaderboard-list" id="leaderboard-body">
        <!-- Ranks generated dynamically -->
      </div>
      <button class="control-btn btn-reveal" onclick="closeWinnerModal()">Close & Continue</button>
    </div>
  </div>

  <script>
    // 50 Questions (10 per unit from Unit 1 to Unit 5) based on Grade 7 ICT Textbook
    const questions = [
      // --- UNIT 1: CENTRAL PROCESSING UNIT (CPU) ---
      { round: "Unit 1: CPU Location", q: "Where is the Central Processing Unit (CPU) positioned inside a computer?", opts: ["On the Hard Disk", "On the Motherboard inside System Unit", "Inside the Power Supply", "On the Monitor Screen"], ans: 1 },
      { round: "Unit 1: CPU Kitchen Analogy", q: "In the hotel kitchen analogy used in the textbook, what does the Central Processing Unit represent?", opts: ["The Dining Room", "The Hotel Owner", "The Chef", "The Menu Card"], ans: 2 },
      { round: "Unit 1: CPU Kitchen Analogy", q: "What does a 'Dual-Core Processor' mean in the kitchen analogy?", opts: ["A kitchen with 2 stoves", "A kitchen with 2 chefs preparing 2 meals at once", "A chef cooking twice as fast", "Two separate hotels"], ans: 1 },
      { round: "Unit 1: CPU Components", q: "Which part of the CPU performs mathematical and logical functions?", opts: ["Control Unit (CU)", "Memory Registers", "Arithmetic and Logical Unit (ALU)", "Hard Disk Drive"], ans: 2 },
      { round: "Unit 1: CPU Components", q: "Which unit controls all hardware devices and operations of the computer system?", opts: ["Control Unit (CU)", "Arithmetic and Logical Unit (ALU)", "Memory Registers", "Solid State Drive"], ans: 0 },
      { round: "Unit 1: Memory Registers", q: "What is the main feature of Memory Registers inside the CPU?", opts: ["Large storage capacity", "Temporary memory store with very fast access speed", "Permanent storage for movies", "Controls internet connection"], ans: 1 },
      { round: "Unit 1: CPU Evolution", q: "Which electronic technology was used to manufacture First Generation computers?", opts: ["Transistors", "Integrated Circuits (IC)", "Vacuum Tubes", "Microprocessors"], ans: 2 },
      { round: "Unit 1: CPU Evolution", q: "Which electronic technology is used in modern Fourth Generation computers?", opts: ["Vacuum Tubes", "Transistors", "Integrated Circuits (IC)", "Microprocessors"], ans: 3 },
      { round: "Unit 1: Clock Speed", q: "What unit is used to measure the clock speed of a modern CPU?", opts: ["Megabytes (MB)", "Hertz (Hz), MHz, or GHz", "Milliseconds", "Watts"], ans: 1 },
      { round: "Unit 1: Execution Speed", q: "What is the execution speed of First Generation computers measured in?", opts: ["Milliseconds", "Microseconds", "Nanoseconds", "Picoseconds"], ans: 0 },

      // --- UNIT 2: OPERATING SYSTEM & STORAGE ---
      { round: "Unit 2: Operating System", q: "What is the main role of an Operating System (OS)?", opts: ["Acts as a mediator and controls hardware/software", "Cools down the processor", "Cleans dust from the lab", "Calculates numbers only"], ans: 0 },
      { round: "Unit 2: Computer OS", q: "Which of the following is an Operating System used for COMPUTERS?", opts: ["iOS", "Android", "Blackberry OS", "Linux (Ubuntu)"], ans: 3 },
      { round: "Unit 2: Mobile OS", q: "Which of the following is an Operating System used for MOBILE PHONES?", opts: ["Ubuntu", "Windows 10", "Android", "Fedora"], ans: 2 },
      { round: "Unit 2: Storage Classification", q: "According to manufacturing technology, into how many categories can computer storage devices be divided?", opts: ["Two categories", "Three categories", "Four categories", "Five categories"], ans: 1 },
      { round: "Unit 2: Magnetic Media", q: "A Hard Disk Drive belongs to which category of storage devices?", opts: ["Optical Media", "Magnetic Media", "Solid State Media", "Virtual Media"], ans: 1 },
      { round: "Unit 2: Optical Media", q: "Which storage device uses laser beams to read and write data?", opts: ["Compact Disk (CD) / DVD", "Hard Disk", "Pen Drive", "Floppy Disk"], ans: 0 },
      { round: "Unit 2: Floppy Disk", q: "What is the storage capacity of a standard floppy disk?", opts: ["1.44 MB", "700 MB", "4.7 GB", "250 MB"], ans: 0 },
      { round: "Unit 2: File Parts", q: "What are the two main parts that make up a file name in a computer?", opts: ["File Name and File Extension", "Size and Date", "Location and Attribute", "Drive and Folder"], ans: 0 },
      { round: "Unit 2: Folder Purpose", q: "What is the main purpose of creating a folder?", opts: ["To slow down the computer", "To store related files in order for fast retrieval", "To increase electricity flow", "To delete files automatically"], ans: 1 },
      { round: "Unit 2: Permanent Deletion", q: "How do you permanently delete a file or folder so it bypasses the Recycle Bin?", opts: ["Press 'Delete' key once", "Press 'Shift + Delete' keys together", "Drag it to a folder", "Rename the file"], ans: 1 },

      // --- UNIT 3: SECURITY OF COMPUTER SYSTEM ---
      { round: "Unit 3: Security Types", q: "Into what two parts can the security of a computer system be divided?", opts: ["Internal and External", "Hardware Security and Software Security", "Input and Output Security", "Manual and Automatic Security"], ans: 1 },
      { round: "Unit 3: Hardware Threats", q: "Which of the following is a main factor that causes physical damage to hardware devices?", opts: ["Installing antivirus software", "Sudden power failure and high voltage", "Opening text documents", "Typing too fast"], ans: 1 },
      { round: "Unit 3: UPS", q: "What does UPS stand for and what is its primary function?", opts: ["Unified Power System - cools down the computer", "Uninterrupted Power Supply - supplies backup power during failure", "Universal Processor Speed - speeds up CPU", "Underground Power Source - saves electricity"], ans: 1 },
      { round: "Unit 3: Lab Etiquette", q: "Why should students remove shoes when entering the computer laboratory?", opts: ["To keep the lab free of sand and dust", "To make typing faster", "To prevent software viruses", "To keep the room warm"], ans: 0 },
      { round: "Unit 3: Cleaning Lab", q: "How frequently should computers in the laboratory be cleaned to prevent dust accumulation?", opts: ["Every day", "Once a week", "At least once in every three months", "Once a year"], ans: 2 },
      { round: "Unit 3: Malware Definition", q: "How is malicious software (malware) defined?", opts: ["Helpful software for typing letters", "Software designed to intentionally cause damage to software, data, or networks", "An operating system for mobile phones", "A hardware cooling component"], ans: 1 },
      { round: "Unit 3: Worms", q: "Which malware spreads across computer networks or the internet WITHOUT human action or a host program?", opts: ["Computer Virus", "Computer Worm", "Trojan Horse", "Spyware"], ans: 1 },
      { round: "Unit 3: Spyware", q: "What is the specific function of Spyware?", opts: ["To clean disk space", "To secretly collect data about a person's computer or internet usage", "To speed up internet browsing", "To protect against high voltage"], ans: 1 },
      { round: "Unit 3: Backups", q: "What does keeping backups mean?", opts: ["Shutting down the computer safely", "Keeping extra copies of software components and files in a safe place", "Locking the laboratory door", "Deleting old files permanently"], ans: 1 },
      { round: "Unit 3: Biometrics", q: "Which of the following is a modern biometric method used for access control?", opts: ["A secret 4-digit PIN", "Fingerprints, voice, face, or iris recognition", "A physical key lock", "A wooden password card"], ans: 1 },

      // --- UNIT 4: WORD PROCESSING ---
      { round: "Unit 4: Word Processing", q: "What is word processing?", opts: ["Composing, editing, and/or storing text-based documents", "Calculating complex math equations", "Designing video games", "Browsing internet pages"], ans: 0 },
      { round: "Unit 4: Software Examples", q: "Which of the following is an example of word processing software?", opts: ["Microsoft Word", "Android OS", "Rapid Typing Tutor", "MS-DOS"], ans: 0 },
      { round: "Unit 4: Keyboard Groups", q: "Based on their functions, how are the keys on a typical keyboard grouped?", opts: ["Control, Character, Function, Navigation, Numeric keypad", "Input, Process, Output keys", "Upper, Lower, Side keys", "Small, Medium, Large keys"], ans: 0 },
      { round: "Unit 4: Space Bar", q: "What happens when the Space bar is pressed once?", opts: ["Creates a single empty space between two words", "Moves cursor to the next line", "Deletes a letter", "Opens a new document"], ans: 0 },
      { round: "Unit 4: Backspace Key", q: "What does the Backspace key do when pressed once?", opts: ["Deletes any character or space to the left of the cursor", "Deletes text to the right of the cursor", "Saves the document", "Prints the page"], ans: 0 },
      { round: "Unit 4: Touch Typing", q: "What is touch typing?", opts: ["Typing while looking at each key", "The act of typing quickly and accurately without looking at the keys", "Typing using a mobile phone screen", "Using only two fingers to type"], ans: 1 },
      { round: "Unit 4: Typing Tutors", q: "Which of the following is a downloadable typing tutor software mentioned in the textbook?", opts: ["Rapid Typing Tutor", "Microsoft Paint", "Adobe Photoshop", "Winamp"], ans: 0 },
      { round: "Unit 4: Sinhala Keyboards", q: "What are the two types of Sinhala keyboards based on the manner of entering characters?", opts: ["Standard Sinhala Keyboard and Phonetics Keyboard", "English and Tamil Keyboard", "Unicode and Non-Unicode Keyboard", "Upper and Lower Keyboard"], ans: 0 },
      { round: "Unit 4: Standard Sinhala", q: "What is the standard Sinhala keyboard model operated in present computers called?", opts: ["Wijesekara Sinhala Keyboard", "Tamil Unicode Keyboard", "QWERTY Standard Keyboard", "Font Bijay Keyboard"], ans: 0 },
      { round: "Unit 4: Unicode Advantage", q: "What is a key advantage of using a Unicode font?", opts: ["It requires special installation on every reader's computer", "To read Unicode text, the user does not need the font pre-installed in their computer", "It only works offline", "It cannot be saved as a file"], ans: 1 },

      // --- UNIT 5: PROGRAMME DEVELOPMENT & SCRATCH ---
      { round: "Unit 5: Decomposition", q: "What are the advantages of decomposing a complex problem into sub-problems?", opts: ["It makes the problem harder", "It is easy to solve, understand, describe, and analyze", "It increases computer bugs", "It deletes extra files"], ans: 1 },
      { round: "Unit 5: Control Structures", q: "What are the three types of control structures used in algorithms and flowcharts?", opts: ["Input, Process, Output", "Sequence, Selection, Repetition", "Start, Calculate, Stop", "Line, Circle, Diamond"], ans: 1 },
      { round: "Unit 5: Sequence", q: "How is a sequence defined in an algorithm?", opts: ["Execution of instructions repeatedly", "Execution of instructions sequentially from top to bottom", "Making a choice based on a condition", "Random execution of steps"], ans: 1 },
      { round: "Unit 5: Selection", q: "How does a selection control structure make decisions?", opts: ["By looping endlessly", "By making a decision based on whether a condition is true or false", "By deleting variables", "By stopping the program immediately"], ans: 1 },
      { round: "Unit 5: Repetition", q: "What is a repetition control structure?", opts: ["Execution of instructions once only", "Execution of an instruction or instructions repeatedly until a condition is satisfied", "Changing text fonts", "Opening a new document"], ans: 1 },
      { round: "Unit 5: Scratch Software", q: "What type of software is Scratch?", opts: ["A commercial word processor", "A visual programme development software that is free and open source", "An operating system for servers", "A hardware diagnostic tool"], ans: 1 },
      { round: "Unit 5: Variables", q: "In programming, what is a variable used for?", opts: ["To store a value in memory temporarily", "To permanently delete files", "To print documents", "To scan for computer viruses"], ans: 0 },
      { round: "Unit 5: Bugs", q: "What is a bug in the context of computer programming?", opts: ["A helpful command block", "An error in a program", "An external storage device", "A type of computer virus"], ans: 1 },
      { round: "Unit 5: Debugging", q: "What is debugging?", opts: ["Creating new errors", "The elimination of bugs in a programme", "Installing an operating system", "Backing up files"], ans: 1 },
      { round: "Unit 5: Scratch Blocks", q: "In Scratch, which block category contains command blocks pertaining to making a variable and assigning values?", opts: ["Motion", "Looks", "Data", "Sensing"], ans: 2 }
    ];

    let currentQIndex = 0;
    let score = 0;
    let teamName = "Team 1";
    let isRevealed = false;

    function renderQuestion() {
      isRevealed = false;
      const q = questions[currentQIndex];
      
      document.getElementById("round-badge").textContent = q.round;
      document.getElementById("q-counter").textContent = `Question ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("question-text").textContent = q.q;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        const textEl = document.getElementById(`opt-text-${i}`);
        textEl.textContent = q.opts[i];
        optEl.classList.remove("dimmed", "correct-answer");
      }
    }

    // Direct interaction when kid clicks an option card
    function checkAnswer(selectedIdx) {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      if (selectedIdx === correctAns) {
        score += 100; // Adds 100 points for correct answer
      } else {
        score -= 50;  // Deducts 50 points for wrong answer
      }
      document.getElementById("score-0").textContent = score;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function revealAnswer() {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function nextQuestion() {
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      } else {
        showWinnerModal();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function renameTeam() {
      const newName = prompt(`Enter custom name for Team:`, teamName);
      if (newName && newName.trim() !== "") {
        teamName = newName.trim();
        document.getElementById("tname-0").textContent = teamName;
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById("winner-modal");
      const headline = document.getElementById("winner-headline");
      const subtext = document.getElementById("winner-subtext");
      const leaderboardBody = document.getElementById("leaderboard-body");

      headline.textContent = `🏆 WELL DONE!`;
      subtext.textContent = `You finished the challenge, ${teamName}!`;

      leaderboardBody.innerHTML = `
        <div class="leaderboard-item rank-1">
          <span>🥇 ${teamName} Final Score</span><span>${score} pts</span>
        </div>
      `;

      modal.style.display = "flex";
    }

    function closeWinnerModal() {
      document.getElementById("winner-modal").style.display = "none";
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.code === 'ArrowRight') nextQuestion();
      if (event.code === 'ArrowLeft') prevQuestion();
      if (event.code === 'Space') revealAnswer();
    });

    // Initialize Game
    renderQuestion();
  </script>
</body>
</html>

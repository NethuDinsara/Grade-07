
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 7 ICT - Ultimate Classroom Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
    
    /* Top Header & Scoreboard */
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; }
    .game-title { font-size: 1.5rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .q-counter { font-size: 1.2rem; background: #334155; padding: 6px 18px; border-radius: 20px; font-weight: 600; color: #f1f5f9; }
    
    /* Scoreboard & Team Cards */
    .scoreboard { display: flex; gap: 12px; }
    .team-card { background: #0f172a; padding: 8px 12px; border-radius: 12px; border: 1px solid #475569; text-align: center; min-width: 110px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-header { display: flex; justify-content: center; align-items: center; gap: 4px; }
    .team-name { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rename-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; }
    .rename-btn:hover { color: #f59e0b; }
    .team-score { font-size: 1.4rem; font-weight: bold; color: #f59e0b; margin: 2px 0; }
    .score-controls { display: flex; justify-content: center; gap: 4px; }
    .score-btn { background: #334155; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .score-btn:hover { background: #475569; }

    /* Main Question Box */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; margin: 0 auto; width: 100%; }
    .round-badge { align-self: center; background: #8b5cf6; color: #fff; padding: 6px 22px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .question-box { background: #1e293b; padding: 35px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; border: 2px solid #334155; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 2rem; font-weight: 700; line-height: 1.35; color: #f8fafc; }

    /* Options Grid (Kahoot Theme) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .option-card { padding: 22px 20px; border-radius: 16px; display: flex; align-items: center; font-size: 1.4rem; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .option-card:hover { transform: translateY(-3px); }
    
    .shape { font-size: 2rem; margin-right: 18px; opacity: 0.95; }
    .opt-a { background-color: #e21b3c; color: white; }
    .opt-b { background-color: #1368ce; color: white; }
    .opt-c { background-color: #d89e00; color: white; }
    .opt-d { background-color: #26890c; color: white; }

    .dimmed { opacity: 0.2; transform: scale(0.98); }
    .correct-answer { transform: scale(1.03); outline: 4px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.8); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 15px rgba(255,255,255,0.4); }
      to { box-shadow: 0 0 35px rgba(255,255,255,0.95); }
    }

    /* Footer Controls */
    footer { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; background: #1e293b; padding: 15px 25px; border-radius: 16px; border: 1px solid #334155; }
    .control-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-nav { background: #475569; color: white; }
    .btn-nav:hover { background: #64748b; }
    .btn-reveal { background: #f59e0b; color: #0f172a; font-size: 1.25rem; padding: 12px 36px; }
    .btn-reveal:hover { background: #d97706; }
    .btn-finish { background: #ec4899; color: white; }
    .btn-finish:hover { background: #db2777; }

    /* Winner Popup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 3px solid #f59e0b; border-radius: 24px; padding: 40px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .trophy-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    
    .winner-title { font-size: 2.2rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .winner-subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }
    .leaderboard-list { margin-bottom: 30px; text-align: left; background: #0f172a; border-radius: 16px; padding: 15px 20px; border: 1px solid #334155; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: 600; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-1 { color: #f59e0b; }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #b45309; }
    .rank-4 { color: #64748b; }
  </style>
</head>
<body>

  <!-- Top Header with Scoreboard & Team Rename -->
  <header>
    <div class="game-title">🎮 Grade 7 ICT Challenge</div>
    <div class="q-counter" id="q-counter">Question 1 / 35</div>
    <div class="scoreboard">
      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-0">Team A</span>
          <button class="rename-btn" onclick="renameTeam(0)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-0">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(0, 100)">+100</button>
          <button class="score-btn" onclick="addScore(0, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-1">Team B</span>
          <button class="rename-btn" onclick="renameTeam(1)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-1">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(1, 100)">+100</button>
          <button class="score-btn" onclick="addScore(1, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-2">Team C</span>
          <button class="rename-btn" onclick="renameTeam(2)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-2">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(2, 100)">+100</button>
          <button class="score-btn" onclick="addScore(2, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-3">Team D</span>
          <button class="rename-btn" onclick="renameTeam(3)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-3">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(3, 100)">+100</button>
          <button class="score-btn" onclick="addScore(3, -50)">-50</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Question Screen -->
  <main>
    <div class="round-badge" id="round-badge">Unit 1: Central Processing Unit</div>
    <div class="question-box">
      <div class="question-text" id="question-text">Loading Question...</div>
    </div>

    <div class="options-grid">
      <div class="option-card opt-a" id="opt-0">
        <span class="shape">▲</span><span id="opt-text-0">Option A</span>
      </div>
      <div class="option-card opt-b" id="opt-1">
        <span class="shape">◆</span><span id="opt-text-1">Option B</span>
      </div>
      <div class="option-card opt-c" id="opt-2">
        <span class="shape">●</span><span id="opt-text-2">Option C</span>
      </div>
      <div class="option-card opt-d" id="opt-3">
        <span class="shape">■</span><span id="opt-text-3">Option D</span>
      </div>
    </div>
  </main>

  <!-- Control Buttons -->
  <footer>
    <button class="control-btn btn-nav" onclick="prevQuestion()">◄ Previous</button>
    <button class="control-btn btn-reveal" onclick="revealAnswer()">Show Answer 👁️</button>
    <button class="control-btn btn-finish" onclick="showWinnerModal()">Finish Game 🏆</button>
    <button class="control-btn btn-nav" onclick="nextQuestion()">Next Question ►</button>
  </footer>

  <!-- Winner Pop-up Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="trophy-icon">🏆</div>
      <div class="winner-title" id="winner-headline">CHAMPIONS!</div>
      <div class="winner-subtitle" id="winner-subtext">Great job Grade 7 ICT students!</div>
      <div class="leaderboard-list" id="leaderboard-body">
        <!-- Ranks generated dynamically -->
      </div>
      <button class="control-btn btn-reveal" onclick="closeWinnerModal()">Close & Continue</button>
    </div>
  </div>

  <script>
    // 35 Questions covering Grade 7 ICT (Unit 1 to Unit 5 fully)
    const questions = [
      // --- UNIT 1: CENTRAL PROCESSING UNIT (CPU) ---
      { round: "Unit 1: CPU Architecture", q: "Where is the Central Processing Unit (CPU) located inside a computer?", opts: ["On the Hard Disk", "On the Motherboard inside System Unit", "Inside the Power Supply", "On the Monitor Screen"], ans: 1 },
      { round: "Unit 1: CPU Kitchen Analogy", q: "If the computer is like a hotel kitchen, what does the CPU represent?", opts: ["The Dining Room", "The Hotel Owner", "The Chef", "The Menu Card"], ans: 2 },
      { round: "Unit 1: CPU Kitchen Analogy", q: "What does a 'Dual-Core Processor' mean in the kitchen analogy?", opts: ["A kitchen with 2 stoves", "A kitchen with 2 chefs preparing 2 meals at once", "A chef cooking twice as fast", "Two separate hotels"], ans: 1 },
      { round: "Unit 1: CPU Components", q: "Which part of the CPU performs mathematical calculations and logical comparisons?", opts: ["Control Unit (CU)", "Memory Registers", "Arithmetic and Logical Unit (ALU)", "Hard Disk Drive"], ans: 2 },
      { round: "Unit 1: CPU Components", q: "Which unit controls all hardware devices and operations of the computer?", opts: ["Control Unit (CU)", "Arithmetic and Logical Unit (ALU)", "Memory Registers", "Solid State Drive"], ans: 0 },
      { round: "Unit 1: CPU Components", q: "What is the main feature of Memory Registers inside the CPU?", opts: ["Large storage capacity", "Temporary storage with very fast access speed", "Permanent storage for movies", "Controls internet connection"], ans: 1 },
      { round: "Unit 1: CPU Evolution", q: "Which electronic technology was used in First Generation computers?", opts: ["Transistors", "Integrated Circuits (IC)", "Vacuum Tubes", "Microprocessors"], ans: 2 },
      { round: "Unit 1: CPU Evolution", q: "Which electronic technology is used in modern Fourth Generation computers?", opts: ["Vacuum Tubes", "Transistors", "Integrated Circuits (IC)", "Microprocessors"], ans: 3 },
      { round: "Unit 1: CPU Clock Speed", q: "What unit is used to measure the clock speed of a modern CPU?", opts: ["Megabytes (MB)", "Hertz (Hz) or Gigahertz (GHz)", "Milliseconds", "Watts"], ans: 1 },

      // --- UNIT 2: OPERATING SYSTEM & STORAGE ---
      { round: "Unit 2: Operating System", q: "What is the main role of an Operating System (OS)?", opts: ["Acts as a mediator between user and hardware", "Cools down the processor", "Cleans dust from the lab", "Calculates numbers only"], ans: 0 },
      { round: "Unit 2: Types of OS", q: "Which of the following is an Operating System used for MOBILE PHONES?", opts: ["Ubuntu", "Windows 10", "Android", "Fedora"], ans: 2 },
      { round: "Unit 2: Types of OS", q: "Which of the following is an Operating System designed for COMPUTERS?", opts: ["iOS", "Blackberry OS", "Android", "Linux (Ubuntu)"], ans: 3 },
      { round: "Unit 2: Storage Devices", q: "A Hard Disk Drive belongs to which category of storage devices?", opts: ["Optical Media", "Magnetic Media", "Solid State Media", "Virtual Media"], ans: 1 },
      { round: "Unit 2: Storage Devices", q: "Which storage device uses LASER BEAMS to read and write data?", opts: ["Compact Disk (CD) / DVD", "Hard Disk", "Pen Drive", "Floppy Disk"], ans: 0 },
      { round: "Unit 2: Storage Devices", q: "Why are Pen Drives and SSDs called 'Solid State Media Devices'?", opts: ["They are made of heavy metal", "They have no moving parts and read data electronically", "They store data on shiny plates", "They run on magnetic tape"], ans: 1 },
      { round: "Unit 2: File Management", q: "How do you PERMANENTLY delete a file so it doesn't go to the Recycle Bin?", opts: ["Press 'Delete' key once", "Press 'Shift + Delete' keys together", "Drag it to a folder", "Rename the file"], ans: 1 },

      // --- UNIT 3: SECURITY OF COMPUTER SYSTEM ---
      { round: "Unit 3: Hardware Security", q: "Which device protects a computer from a sudden loss of electricity?", opts: ["Surge Protector", "Uninterruptible Power Supply (UPS)", "Cooling Fan", "Miniature Circuit Breaker (MCB)"], ans: 1 },
      { round: "Unit 3: Hardware Security", q: "What device protects the computer system from sudden HIGH VOLTAGE currents?", opts: ["Surge Protector / MCB", "UPS", "Hard Disk", "Biometric Sensor"], ans: 0 },
      { round: "Unit 3: Hardware Security", q: "Why should we avoid eating food and drinks inside the computer lab?", opts: ["It slows down the CPU", "It attracts ants/insects that can damage hardware", "It deletes software files", "It turns off the screen"], ans: 1 },
      { round: "Unit 3: Biometric Security", q: "Which of the following is an example of a BIOMETRIC password?", opts: ["A secret 8-letter word", "Fingerprints or Iris/Face recognition", "A PIN number", "A physical key lock"], ans: 1 },
      { round: "Unit 3: Software Malware", q: "What is 'Malware'?", opts: ["Hardware tools", "Malicious software created to harm data and computers", "An anti-virus program", "A web browser"], ans: 1 },
      { round: "Unit 3: Malware Types", q: "Which malware spreads automatically across networks WITHOUT human action?", opts: ["Computer Virus", "Computer Worm", "Trojan Horse", "Spyware"], ans: 1 },
      { round: "Unit 3: Malware Protection", q: "What does 'Keeping Data Backups' mean?", opts: ["Locking the computer room", "Keeping extra copies of important files in a safe place", "Installing new hardware", "Scanning with antivirus"], ans: 1 },

      // --- UNIT 4: WORD PROCESSING ---
      { round: "Unit 4: Word Processing", q: "Which keyboard shortcut creates a NEW blank document in Word?", opts: ["Ctrl + O", "Ctrl + N", "Ctrl + S", "Ctrl + P"], ans: 1 },
      { round: "Unit 4: Word Processing", q: "Which shortcut key PASTES copied or cut text into a document?", opts: ["Ctrl + C", "Ctrl + X", "Ctrl + V", "Ctrl + Z"], ans: 2 },
      { round: "Unit 4: Word Processing", q: "To write chemical formulas like H₂O, which formatting tool is used?", opts: ["Superscript", "Subscript", "Strikethrough", "Bold"], ans: 1 },
      { round: "Unit 4: Word Processing", q: "To write math powers like x², which formatting tool raises the number?", opts: ["Subscript", "Superscript", "Italic", "Highlight"], ans: 1 },
      { round: "Unit 4: Word Processing", q: "Which alignment distributes text EVENLY between left and right margins?", opts: ["Align Left", "Center", "Align Right", "Justify"], ans: 3 },
      { round: "Unit 4: Word Processing", q: "What is the intersection of a vertical column and horizontal row in a table?", opts: ["Cell", "Grid", "Border", "Margin"], ans: 0 },

      // --- UNIT 5: PROGRAMME DEVELOPMENT & SCRATCH ---
      { round: "Unit 5: IPO Model", q: "In problem solving, what do the letters 'IPO' stand for?", opts: ["Import, Process, Output", "Input, Process, Output", "Input, Program, Option", "Idea, Plan, Outcome"], ans: 1 },
      { round: "Unit 5: Flowcharts", q: "Which flowchart shape represents the START or END of an algorithm?", opts: ["Rectangle", "Parallelogram", "Oval / Capsule", "Diamond"], ans: 2 },
      { round: "Unit 5: Flowcharts", q: "Which flowchart symbol is used for taking INPUT or showing OUTPUT?", opts: ["Rectangle", "Parallelogram", "Diamond", "Circle"], ans: 1 },
      { round: "Unit 5: Flowcharts", q: "Which flowchart shape performs a calculation or action step (Process)?", opts: ["Rectangle", "Diamond", "Oval", "Parallelogram"], ans: 0 },
      { round: "Unit 5: Scratch Coding", q: "In Scratch, which block category contains 'say Hello' and 'switch costume'?", opts: ["Motion (Blue)", "Looks (Purple)", "Events (Brown)", "Control (Yellow)"], ans: 1 },
      { round: "Unit 5: Scratch Coding", q: "In Scratch, which category contains 'when green flag clicked'?", opts: ["Events (Brown)", "Motion (Blue)", "Sensing (Light Blue)", "Operators (Light Green)"], ans: 0 }
    ];

    let currentQIndex = 0;
    let scores =;
    let teamNames = ["Team A", "Team B", "Team C", "Team D"];
    let isRevealed = false;

    function renderQuestion() {
      isRevealed = false;
      const q = questions[currentQIndex];
      
      document.getElementById("round-badge").textContent = q.round;
      document.getElementById("q-counter").textContent = `Question ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("question-text").textContent = q.q;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        const textEl = document.getElementById(`opt-text-${i}`);
        textEl.textContent = q.opts[i];
        optEl.classList.remove("dimmed", "correct-answer");
      }
    }

    function revealAnswer() {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function nextQuestion() {
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      } else {
        showWinnerModal();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function addScore(teamIndex, points) {
      scores[teamIndex] += points;
      document.getElementById(`score-${teamIndex}`).textContent = scores[teamIndex];
    }

    function renameTeam(teamIndex) {
      const newName = prompt(`Enter custom name for ${teamNames[teamIndex]}:`, teamNames[teamIndex]);
      if (newName && newName.trim() !== "") {
        teamNames[teamIndex] = newName.trim();
        document.getElementById(`tname-${teamIndex}`).textContent = teamNames[teamIndex];
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById("winner-modal");
      const headline = document.getElementById("winner-headline");
      const subtext = document.getElementById("winner-subtext");
      const leaderboardBody = document.getElementById("leaderboard-body");

      // Sort teams by score
      const teamObjects = teamNames.map((name, idx) => ({ name: name, score: scores[idx] }));
      teamObjects.sort((a, b) => b.score - a.score);

      const topScore = teamObjects.score;
      const winners = teamObjects.filter(t => t.score === topScore);

      if (winners.length === 1) {
        headline.textContent = `🏆 WINNER: ${winners.name.toUpperCase()}!`;
        subtext.textContent = `Outstanding Performance with ${winners.score} Points!`;
      } else {
        const winnerNames = winners.map(w => w.name).join(" & ");
        headline.textContent = `🤝 IT'S A TIE!`;
        subtext.textContent = `${winnerNames} tied with ${topScore} Points!`;
      }

      leaderboardBody.innerHTML = "";
      const rankClasses = ["rank-1", "rank-2", "rank-3", "rank-4"];
      const rankLabels = ["1st Place 🥇", "2nd Place 🥈", "3rd Place 🥉", "4th Place 🎗️"];

      teamObjects.forEach((t, i) => {
        const item = document.createElement("div");
        item.className = `leaderboard-item ${rankClasses[i]}`;
        item.innerHTML = `<span>${rankLabels[i]} — ${t.name}</span><span>${t.score} pts</span>`;
        leaderboardBody.appendChild(item);
      });

      modal.style.display = "flex";
    }

    function closeWinnerModal() {
      document.getElementById("winner-modal").style.display = "none";
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.code === 'ArrowRight') nextQuestion();
      if (event.code === 'ArrowLeft') prevQuestion();
      if (event.code === 'Space') revealAnswer();
    });

    // Initialize Game
    renderQuestion();
  </script>
</body>
</html>
